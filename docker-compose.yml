# Lokal ishga tushirish:  docker compose up --build
# Productionda: HTTPS (reverse proxy), kuchli JWT_SECRET va DB paroli, EXPOSE_RESET_TOKEN=false
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fithayot
      POSTGRES_PASSWORD: fithayot
      POSTGRES_DB: fithayot360
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fithayot"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      APP_ENV: development            # productionda JWT_SECRET majburiy o'zgartiriladi
      DATABASE_URL: postgresql+psycopg2://fithayot:fithayot@db:5432/fithayot360
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      EXPOSE_RESET_TOKEN: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fithayot.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
    ports: ["8000:8000"]
volumes:
  pgdata:
